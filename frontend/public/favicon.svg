<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Market Deck modular market grid logo">
  <style>
    svg {
      fill: url(#market-gradient);
    }
    .pink { stop-color: #c43c6d; }
    .green { stop-color: #237a57; }
    @media (prefers-color-scheme: dark) {
      .pink { stop-color: #fc8181; }
      .green { stop-color: #68d391; }
    }
  </style>
  <defs>
    <linearGradient id="market-gradient" x1="48" y1="48" x2="464" y2="464" gradientUnits="userSpaceOnUse">
      <stop class="pink"/>
      <stop class="green" offset="1"/>
    </linearGradient>
  </defs>
  <g>
    <!-- Four card-columns make a dense market grid; their top edge is a
         recognisable price path even at favicon scale. -->
    <path d="M48 296h88v168H48zM160 216h88v248h-88zM272 264h88v200h-88zM384 96h80v368h-80z"/>
    <!-- Small cap blocks echo a terminal cursor / OHLC tick. -->
    <path d="M48 248h88v24H48zM160 168h88v24h-88zM272 216h88v24h-88zM384 48h80v24h-80z"/>
  </g>
</svg>
